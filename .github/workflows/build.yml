name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal macOS plugin
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build VST3, standalone and DSP tests
        run: cmake --build build --config Release --parallel 3
      - name: Run DSP tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent build/FluteShift_artefacts/Release/VST3/FluteShift.vst3 FluteShift-macOS-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FluteShift-macOS-universal
          path: FluteShift-macOS-universal.zip
          if-no-files-found: error
